[mypy]
python_version = 3.8
strict = True
show_error_codes = True
warn_unused_configs = True
files = astrostudio/core, astrostudio/adapters

# Pragmatic exceptions for the PyGObject/CLI codebase. These are reviewed
# explicitly; new code should still use annotations and Optional where needed.
no_implicit_optional = False
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_any_generics = False
warn_return_any = False

[mypy-gi.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True
