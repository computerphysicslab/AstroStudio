name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip gir1.2-gtk-3.0 libcairo2-dev python3-gi desktop-file-utils xvfb
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Mypy strict
        run: python3 -m mypy --config-file mypy.ini
      - name: Tests with coverage
        run: xvfb-run -a python3 -m pytest tests/ -q --cov=astrostudio/core --cov=astrostudio/adapters --cov-fail-under=70
      - name: Desktop entry
        run: desktop-file-validate packaging/astro-studio.desktop
